name: Build Android APK

# Runs on every push to main, and can be triggered manually from the Actions tab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build web app (Vite -> dist/)
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform (first run) & sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate app icon from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#FBD1E1' --iconBackgroundColorDark '#FBD1E1' --splashBackgroundColor '#FBD1E1'

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preventive-care-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
